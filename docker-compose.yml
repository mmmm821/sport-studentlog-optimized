version: "3.9"

services:
  sportlog:
    build: .
    container_name: sportlog
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-please_change_this_secret}
      - JWT_EXPIRES_IN=7d
      - DB_PATH=/app/data/sportlog.db
    volumes:
      - sportlog-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sportlog-data:
    driver: local
