services:
  - type: web
    name: sportlog
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/data/sportlog.db
    disk:
      name: sportlog-data
      mountPath: /opt/render/project/data
      sizeGB: 1
